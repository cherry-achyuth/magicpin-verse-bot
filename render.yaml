services:
  - type: web
    name: magicpin-vera-bot
    env: python
    buildCommand: pip install -r submission/requirements.txt
    startCommand: uvicorn submission.bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
