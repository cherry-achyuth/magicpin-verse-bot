[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-bot"
version = "0.1.0"
description = "Vera Merchant AI Assistant bot submission"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn==0.33.0",
    "pydantic==2.10.6",
    "openai==2.2.0",
    "anthropic==0.72.0",
    "google-generativeai==0.1.0rc1",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
]
